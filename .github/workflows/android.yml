name: Build Android app
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build
        run: gradle -p android assembleDebug --no-daemon
      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DriverDay.apk
      - uses: actions/upload-artifact@v4
        with: { name: DriverDay-apk, path: DriverDay.apk }
      - name: Publish for phone download
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete app --yes --cleanup-tag || true
          gh release create app DriverDay.apk --title "Driver Day Android app" --notes "Install on Android: open DriverDay.apk and allow the install. The app opens the password-locked Driver Day page; it holds no figures itself."
